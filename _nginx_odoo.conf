upstream odoo1 {
    server 127.0.0.1:8069;
}

upstream odoo1_longpolling {
    server 127.0.0.1:8072;
}

upstream odoo2 {
    server 127.0.0.1:8070;
}

upstream odoo2_longpolling {
    server 127.0.0.1:8073;
}

# =========================
# ROBIFEL (ODOO 1)
# =========================
server {
    server_name odoo.robifel.in;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    client_max_body_size 100M;


    # Robifel Admin Portal (React SPA)
    location ^~ /portal {
        alias /var/www/robifel-portal;
        index index.html;
        location ~* ^/portal/(assets/.+)$ {
            alias /var/www/robifel-portal/$1;
            add_header Cache-Control "public, max-age=2592000";
        }
        try_files $uri $uri/ @portal_fallback;
    }
    location @portal_fallback {
        rewrite ^ /portal/index.html last;
    }

    # APK Download page
    location ^~ /download {
        alias /var/www/robifel-download;
        index index.html;
        try_files $uri $uri/ =404;
        types { application/vnd.android.package-archive apk; text/html html; }
    }

    location /longpolling {
        proxy_pass http://odoo1_longpolling;
    }

    # Redirect the bare root to the Odoo web client (exact match only, so
    # /web, /odoo, /portal and asset paths keep proxying normally).
    location = / {
        return 301 /odoo;
    }

    location / {
        proxy_pass http://odoo1;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/odoo.robifel.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odoo.robifel.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name odoo.robifel.in;
    return 301 https://$host$request_uri;
}

# =========================
# QUEENFINGER (ODOO 2)
# =========================
server {
    server_name queenfinger.store admin.queenfinger.store;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    client_max_body_size 100M;

    location /longpolling {
        proxy_pass http://odoo2_longpolling;
    }

    location / {
        proxy_pass http://odoo2;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/queenfinger.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/queenfinger.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
